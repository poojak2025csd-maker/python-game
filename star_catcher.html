<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Catcher</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1120;color:#fff;font:16px Arial,sans-serif;
display:flex;min-height:100vh;align-items:center;justify-content:center}
main{text-align:center;padding:18px}h1{color:#facc15;letter-spacing:3px}
canvas{width:min(92vw,500px);height:auto;background:#101827;border:2px solid #38bdf8;display:block}
p{color:#cbd5e1}button{padding:10px 18px;margin:6px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
</style></head>
<body><main><h1>⭐ STAR CATCHER</h1>
<p>Move with ← → or A / D. Catch falling stars. Miss 3 and the game ends.</p>
<canvas id="game" width="500" height="400"></canvas>
<p><button onclick="restart()">RESTART</button></p>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let score,lives,px,stars,over,keys;
function restart(){score=0;lives=3;px=250;stars=[];over=false;keys={};}
function frame(){
 ctx.clearRect(0,0,500,400);
 if(!over){
   if(Math.random()<.045)stars.push({x:Math.random()*476,y:-24});
   if(keys.ArrowLeft||keys.a)px=Math.max(35,px-4);
   if(keys.ArrowRight||keys.d)px=Math.min(465,px+4);
   stars=stars.filter(s=>{
     s.y+=3.5;
     if(s.y+24>=350&&s.y<=364&&s.x+24>=px-35&&s.x<=px+35){score+=10;return false;}
     if(s.y>400){lives--;if(lives<=0)over=true;return false;}
     return true;
   });
 }
 ctx.fillStyle='#fff';ctx.font='bold 15px Arial';ctx.fillText('SCORE '+score+'   LIVES '+lives,12,24);
 ctx.fillStyle='#38bdf8';ctx.fillRect(px-35,350,70,14);
 stars.forEach(s=>{ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(s.x+12,s.y+12,12,0,Math.PI*2);ctx.fill();});
 if(over){ctx.fillStyle='rgba(11,17,32,.88)';ctx.fillRect(70,125,360,150);
 ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 25px Arial';ctx.fillText('GAME OVER',250,175);
 ctx.font='18px Arial';ctx.fillText('Score: '+score+' | Press R to restart',250,215);ctx.textAlign='left';}
 requestAnimationFrame(frame);
}
document.addEventListener('keydown',e=>{keys[e.key==='ArrowLeft'?'ArrowLeft':e.key==='ArrowRight'?'ArrowRight':e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')restart();});
document.addEventListener('keyup',e=>{keys[e.key==='ArrowLeft'?'ArrowLeft':e.key==='ArrowRight'?'ArrowRight':e.key.toLowerCase()]=false;});
restart();frame();
</script></main></body></html>
